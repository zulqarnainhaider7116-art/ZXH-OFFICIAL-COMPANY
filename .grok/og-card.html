<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Outfit;
        src: url("Outfit.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0a0b;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        font-family: Outfit, "Liberation Sans", "DejaVu Sans", sans-serif;
        color: #f4f1ea;
      }
      .bg {
        position: absolute;
        inset: 0;
        object-fit: cover;
        object-position: 50% 18%;
        width: 1200px;
        height: 630px;
        filter: brightness(0.52) saturate(0.82) contrast(1.12);
      }
      .wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 58% 62% at 50% 48%, rgba(10, 10, 11, 0.18), rgba(10, 10, 11, 0.72) 78%),
          linear-gradient(180deg, rgba(10, 10, 11, 0.28), transparent 22%, transparent 78%, rgba(10, 10, 11, 0.55));
      }
      .lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 62%;
        text-align: center;
      }
      .glass {
        padding: 42px 48px 36px;
        border-radius: 28px;
        background: rgba(10, 10, 11, 0.58);
        box-shadow:
          0 0 0 1px rgba(244, 241, 234, 0.16),
          0 28px 70px -18px rgba(0, 0, 0, 0.72),
          inset 0 1px 0 rgba(244, 241, 234, 0.18);
        backdrop-filter: blur(16px) saturate(1.05);
      }
      .wordmark {
        margin: 0;
        font-size: 168px;
        font-weight: 600;
        letter-spacing: -0.08em;
        line-height: 0.88;
        background-image: linear-gradient(
          180deg,
          #f7f8fa 0%,
          #d5d8de 28%,
          #8c919b 48%,
          #e8eaee 62%,
          #9aa0aa 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 12px 22px #00000080);
      }
      .sub {
        margin-top: 14px;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #f4f1ea;
      }
      .rule {
        width: 88px;
        height: 1px;
        margin: 18px auto 14px;
        background: linear-gradient(90deg, transparent, #c8ccd4, transparent);
      }
      .tag {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #c8ccd4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="bg" src="file:///workspace/public/company/poster-hq.png" alt="" />
      <div class="wash"></div>
      <div class="lockup">
        <div class="glass">
          <h1 class="wordmark">ZXH</h1>
          <div class="sub">Official Company</div>
          <div class="rule"></div>
          <div class="tag">Turning Ideas Into Reality</div>
        </div>
      </div>
    </div>
  </body>
</html>
